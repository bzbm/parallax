<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root {
    --bg: #fafafa; --fg: #1a1a1a; --muted: #8a8a8a; --line: #e2e2e2; --accent: #e5322d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #e6e6e6; --muted: #777; --line: #2a2a2a; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; }
  body.drop::after {
    content: ''; position: fixed; inset: 10px; border: 1.5px dashed var(--accent);
    border-radius: 14px; pointer-events: none;
  }

  .bar {
    height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px;
    border-bottom: 1px solid var(--line);
  }
  .crumbs { flex: 1; display: flex; align-items: center; gap: 6px; color: var(--muted); overflow: hidden; white-space: nowrap; }
  .crumbs .sep { opacity: .5; }
  .crumbs a { cursor: pointer; }
  .crumbs a:hover { color: var(--accent); }
  .crumbs a.here { color: var(--fg); cursor: default; }
  .crumbs a.here:hover { color: var(--fg); }

  button {
    font: inherit; color: var(--muted); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px;
    transition: color .15s, border-color .15s;
  }
  button:hover { color: var(--accent); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input {
    font: inherit; color: var(--fg); background: transparent; width: 150px;
    border: 1px solid var(--accent); border-radius: 14px; padding: 4px 12px; outline: none;
  }

  .list { flex: 1; overflow-y: auto; padding: 6px 8px 20px; }
  .list::-webkit-scrollbar { display: none; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px;
    cursor: default;
  }
  .row:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
  .row.dir { cursor: pointer; }
  .row .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round; }
  .row.dir .ic { stroke: var(--accent); }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12px; flex: none; }
  .row .acts { display: none; gap: 6px; flex: none; }
  .row:hover .acts { display: flex; }
  .row:hover .meta { display: none; }
  .row .acts button { padding: 2px 10px; font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; line-height: 1.7; }
  .status { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="bar">
  <div class="crumbs" id="crumbs"></div>
  <span class="status" id="status"></span>
  <span id="newslot"></span>
  <button id="b-new">New folder</button>
  <button id="b-clip" title="Save the text on your clipboard as a file in Generated">Save clipboard</button>
  <button id="b-finder">Open in Finder</button>
</div>
<div class="list" id="list"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const listEl = $('list'), crumbsEl = $('crumbs'), statusEl = $('status');
  let cwd = ''; // path relative to the shelf root
  let flashTimer = null;

  const ICON_DIR = '<svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  const ICON_FILE = '<svg class="ic" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>';

  const join = (a, b) => (a ? a + '/' + b : b);
  const TEXT = /\.(txt|md|markdown|json|csv|tsv|py|js|ts|jsx|tsx|html|css|c|cpp|h|java|go|rs|sh|yml|yaml|toml|xml|log|tex)$/i;

  function flash(msg) {
    statusEl.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => (statusEl.textContent = ''), 1800);
  }

  function size(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return Math.round(n / 1024) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(1) + ' GB';
  }

  function renderCrumbs() {
    crumbsEl.textContent = '';
    const parts = cwd ? cwd.split('/') : [];
    const add = (label, rel, here) => {
      const a = document.createElement('a');
      a.textContent = label;
      if (here) a.className = 'here'; else a.onclick = () => go(rel);
      crumbsEl.appendChild(a);
    };
    const sep = () => { const s = document.createElement('span'); s.className = 'sep'; s.textContent = '/'; crumbsEl.appendChild(s); };
    add('Shelf', '', parts.length === 0);
    parts.forEach((p, i) => { sep(); add(p, parts.slice(0, i + 1).join('/'), i === parts.length - 1); });
  }

  async function go(rel) { cwd = rel; await refresh(); }

  async function refresh() {
    renderCrumbs();
    let items = [];
    try { items = await local.list(cwd); } catch { flash('Cannot read folder'); }
    listEl.textContent = '';
    if (!items.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Nothing here yet. Drop files onto this page to add them.';
      listEl.appendChild(e);
      return;
    }
    for (const f of items) listEl.appendChild(row(f));
  }

  function row(f) {
    const rel = join(cwd, f.name);
    const r = document.createElement('div');
    r.className = 'row' + (f.dir ? ' dir' : '');
    r.innerHTML = f.dir ? ICON_DIR : ICON_FILE;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = f.name;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = f.dir ? '' : size(f.size);
    const acts = document.createElement('span');
    acts.className = 'acts';

    const act = (label, fn) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = (e) => { e.stopPropagation(); fn(); };
      acts.appendChild(b);
    };
    if (!f.dir && TEXT.test(f.name)) {
      act('Copy text', async () => {
        const t = await local.text(rel);
        if (t === null) return flash('Too large to copy');
        await local.clipWrite(t);
        flash('Copied');
      });
    }
    act('Reveal', () => local.reveal(rel));
    act('Delete', async () => {
      if (await local.trash(rel)) { flash('Moved to Trash'); refresh(); } else flash('Base folders stay');
    });

    r.append(name, meta, acts);

    if (f.dir) {
      r.onclick = () => go(rel);
    } else {
      // drag a file out into a chat's upload box
      r.draggable = true;
      r.addEventListener('dragstart', (e) => { e.preventDefault(); local.startDrag(rel); });
    }
    return r;
  }

  // ---- toolbar ----
  $('b-new').onclick = () => {
    const slot = $('newslot');
    if (slot.firstChild) return;
    const i = document.createElement('input');
    i.placeholder = 'Folder name';
    const close = () => { slot.textContent = ''; };
    i.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') close();
      if (e.key === 'Enter') {
        if (i.value.trim()) await local.mkdir(cwd, i.value);
        close();
        refresh();
      }
    });
    i.addEventListener('blur', close);
    slot.appendChild(i);
    i.focus();
  };
  $('b-clip').onclick = async () => {
    const name = await local.saveClip();
    if (name) flash('Saved to Generated');
  };
  $('b-finder').onclick = () => local.reveal(cwd);

  // ---- drop files in ----
  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drop'); });
  window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('drop'); });
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    document.body.classList.remove('drop');
    if (!e.dataTransfer.files.length) return;
    const n = await local.importFiles(cwd, e.dataTransfer.files);
    flash(n ? `Added ${n}` : 'Nothing added');
    refresh();
  });

  local.on('refresh', refresh);
  refresh();
</script>
</body>
</html>
