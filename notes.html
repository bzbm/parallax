<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root {
    --bg: #fafafa; --fg: #1a1a1a; --muted: #8a8a8a; --line: #e2e2e2; --accent: #e5322d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #e6e6e6; --muted: #777; --line: #2a2a2a; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
  body { display: flex; flex-direction: column; }

  .bar {
    height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px;
    border-bottom: 1px solid var(--line);
  }
  .bar .title { flex: 1; color: var(--muted); }
  .status { color: var(--muted); font-size: 12px; min-width: 56px; text-align: right; }

  button {
    font: inherit; color: var(--muted); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px;
    transition: color .15s, border-color .15s, background .15s;
  }
  button:hover { color: var(--accent); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { color: #fff; opacity: .9; }

  textarea {
    flex: 1; width: 100%; resize: none; border: 0; outline: none; background: transparent;
    color: var(--fg); padding: 18px 20px;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  textarea::placeholder { color: var(--muted); }
  .foot { flex: none; padding: 8px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="bar">
  <span class="title">Progress notes</span>
  <span class="status" id="status"></span>
  <button id="b-paste" title="Replace the notes with your clipboard">Paste</button>
  <button id="b-dl" title="Load the newest progress*.md from Downloads">From Downloads</button>
  <button id="b-copy" title="Copy the raw notes">Copy</button>
  <button id="b-clear">Clear</button>
  <button class="primary" id="b-hand" title="Copy notes wrapped in a continue prompt">Copy handoff</button>
</div>
<textarea id="pad" spellcheck="false" placeholder="Paste the latest progress.md here. Cmd+Shift+H copies it as a handoff prompt and jumps to the next account."></textarea>
<div class="foot">Saved automatically in Shelf / Notes. Paste, Clear and From Downloads keep the previous version as progress.prev.md.</div>

<script>
  const $ = (id) => document.getElementById(id);
  const pad = $('pad'), status = $('status');
  let timer = null, flashTimer = null;

  function flash(msg) {
    status.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => (status.textContent = ''), 1800);
  }

  async function load() { pad.value = await local.notesLoad(); }

  function queueSave() {
    clearTimeout(timer);
    timer = setTimeout(async () => { await local.notesSave(pad.value); flash('Saved'); }, 250);
  }

  async function replaceWith(text) {
    clearTimeout(timer);
    pad.value = text;
    await local.notesReplace(text);
    flash('Saved');
  }

  pad.addEventListener('input', queueSave);
  pad.addEventListener('blur', () => { clearTimeout(timer); local.notesSave(pad.value); });

  $('b-paste').onclick = async () => {
    const t = await local.clipRead();
    if (!t.trim()) return flash('Clipboard empty');
    replaceWith(t);
  };
  $('b-dl').onclick = async () => {
    const t = await local.notesDownload();
    if (!t) return flash('Nothing in Downloads');
    replaceWith(t);
  };
  $('b-copy').onclick = async () => { await local.clipWrite(pad.value); flash('Copied'); };
  $('b-clear').onclick = () => replaceWith('');
  $('b-hand').onclick = async () => {
    clearTimeout(timer);
    await local.notesSave(pad.value);
    flash((await local.handoff()) ? 'Handoff copied' : 'Notes empty');
  };

  local.on('reload', load);
  load();
</script>
</body>
</html>
